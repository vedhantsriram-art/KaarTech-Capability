<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KaarTech Expertise Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a sequenced portal (three acts, numbered because the order is a real reading path) with a layered portfolio explorer as the interactive centrepiece. */
:root{
  --bg:#f6f5f4; --surface:#ffffff; --surface2:#efeceb; --ink:#1c1a19; --muted:#625d5a; --line:#dcd7d4;
  --red:#9d0102; --red-ink:#9d0102; --orange:#d84300; --on-red:#ffffff; --good:#1f7a4d;
  --shadow:0 1px 2px rgba(28,26,25,.06),0 8px 24px rgba(28,26,25,.06);
  --f-display:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'Public Sans','Segoe UI',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121010; --surface:#1b1817; --surface2:#242020; --ink:#f2eeec; --muted:#a9a19d; --line:#352f2d;
  --red:#c8201f; --red-ink:#ff6a5e; --orange:#ff7a3d; --on-red:#fff; --good:#58c28b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121010; --surface:#1b1817; --surface2:#242020; --ink:#f2eeec; --muted:#a9a19d; --line:#352f2d;
  --red:#c8201f; --red-ink:#ff6a5e; --orange:#ff7a3d; --on-red:#fff; --good:#58c28b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--red-ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.mark{width:30px;height:30px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font:700 14px var(--f-display)}
.brand b{font:700 15px var(--f-display);letter-spacing:-.01em}
.brand span{display:block;font:400 11px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.pri:hover{filter:brightness(1.1)}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .35s}
/* page */
main{padding-block:32px 24px;min-height:70vh}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);margin-bottom:10px}
h1.big{font-size:clamp(34px,6vw,64px);letter-spacing:-.03em;font-weight:700;max-width:16ch}
h2.pt{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.02em;font-weight:700;max-width:24ch}
.lede{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:62ch;margin-top:14px}
.sec{margin-top:36px}
.sec>h3{font-size:15px;letter-spacing:.01em;margin-bottom:12px;font-weight:600}
.sec>h3 small{font:400 11px var(--f-mono);color:var(--muted);margin-left:8px;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card h4{font-size:15px;margin-bottom:8px}
.card p,.card li{color:var(--muted);font-size:14px}
.card ul{margin:8px 0 0;padding-left:18px}
.card li{margin:3px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.stat b{display:block;font:700 clamp(26px,3.2vw,36px) var(--f-display);letter-spacing:-.02em;color:var(--red-ink);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.dk{background:var(--red);border-color:var(--red)}
.stat.dk b,.stat.dk span{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.m{font-family:var(--f-mono);font-size:12px}
.quote{border-left:3px solid var(--orange);padding:4px 0 4px 16px;color:var(--ink);font-size:15px}
.quote cite{display:block;margin-top:8px;font-style:normal;font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.two{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{margin-top:20px}
/* hero */
.hero{display:grid;gap:28px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;padding-block:20px 8px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.hero-art .row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line);gap:12px}
.hero-art .row:last-child{border:0}
.hero-art .row b{font:700 24px var(--f-display);color:var(--red-ink);font-variant-numeric:tabular-nums}
.hero-art .row span{font-size:13px;color:var(--muted);text-align:right}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
/* acts on home */
.act{margin-top:30px}
.act h3{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile:hover{border-color:var(--orange)}
.tile .n{font:500 12px var(--f-mono);color:var(--red-ink);padding-top:3px;min-width:20px}
.tile b{display:block;font:600 15px var(--f-display);margin-bottom:3px}
.tile span{font-size:13px;color:var(--muted)}
/* explorer */
.explorer{display:grid;gap:22px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}
@media(max-width:820px){.explorer{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:10px;perspective:700px}
.slab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px 18px;text-align:left;transition:transform .2s,border-color .2s,background .2s}
.slab small{display:block;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.slab b{font:700 17px var(--f-display)}
.slab[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;transform:translateX(10px)}
.slab[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.chain{display:flex;flex-wrap:wrap;gap:0}
.stage{flex:1 1 150px;min-width:0;border:1px solid var(--line);background:var(--surface);padding:12px 14px;text-align:left;margin:0 -1px -1px 0}
.stage small{font:500 11px var(--f-mono);color:var(--muted)}
.stage b{display:block;font:600 14px var(--f-display);margin-top:2px}
.stage[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);position:relative;z-index:1}
.stage[aria-pressed="true"] small{color:var(--bg);opacity:.7}
.detail{margin-top:14px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.grp h4{font-size:14px;margin-bottom:10px;color:var(--red-ink)}
/* timeline */
.tl{position:relative;margin:26px 0 0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 18px 48px}
.tl .dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--red);display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--red-ink)}
.tl .now .dot{background:var(--red);color:#fff;border-color:var(--red)}
.tl .yr{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tl b{font:700 17px var(--f-display);display:block}
.tl span.s{font-size:14px;color:var(--muted)}
/* waves */
.waves{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.wave{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.wave .w{font:500 11px var(--f-mono);color:var(--red-ink);letter-spacing:.08em}
.wave b{display:block;font:700 15px var(--f-display);margin:2px 0}
.wave .d{font:400 12px var(--f-mono);color:var(--muted)}
.wave p{font-size:13px;color:var(--muted);margin-top:6px}
/* numbered list (rocks) */
.rocks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));list-style:none;margin:0;padding:0}
.rocks li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:500;font-size:14px}
.rocks i{font:600 13px var(--f-mono);font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;color:var(--red-ink);flex:none}
.kv{display:grid;gap:8px}
.kv div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line);padding:7px 0;font-size:14px}
.kv div span:first-child{color:var(--muted)}
.kv div b{font-weight:600;text-align:right}
/* nav */
.pager{display:flex;gap:12px;justify-content:space-between;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pg{flex:1 1 220px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px}
.pg:hover{border-color:var(--orange)}
.pg small{display:block;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pg b{font:600 15px var(--f-display)}
.pg.r{text-align:right}
footer{padding:24px 0 36px;color:var(--muted);font-size:12px}
/* contents overlay */
.ov{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.ov .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fd .3s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== v2: immersive layer ===== */
:root{--hero1:#2a0506;--hero2:#120a0a;--glow:#e44500;--pill:rgba(255,255,255,.08)}
body{padding-left:0;padding-right:0}
.wrap{padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;background:none;border:0;pointer-events:none;padding-inline:max(12px,env(safe-area-inset-left,0px))}
body::before{display:none}
.top .wrap{pointer-events:auto;max-width:1120px;margin:0 auto;padding:8px 10px 8px 14px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
.bar{display:none}
.btn.go{background:var(--red);border-color:var(--red);color:#fff}
.btn.go:hover{filter:brightness(1.12)}
main{padding-block:0;min-height:100vh}
.page{padding-top:96px}
.hero2{position:relative;overflow:hidden;color:#f4eeec;background:radial-gradient(1200px 520px at 78% 0%,rgba(228,69,0,.28),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(157,1,2,.45),transparent 60%),linear-gradient(180deg,var(--hero1),var(--hero2));padding:128px 0 56px}
.hero2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(180deg,#000 30%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%)}
.hero2 .wrap{position:relative}
.hero2 .eyebrow{color:#ff9a6b}
.hero2 h1{font-size:clamp(38px,7vw,78px);letter-spacing:-.035em;font-weight:700;line-height:1.02;max-width:14ch}
.hero2 h1 em{font-style:normal;font-weight:300;display:block;color:#e8d9d4}
.hero2 .lede{color:#cdbdb8;max-width:56ch}
.hero2 .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.hero2 .btn.go{background:#e44500;border-color:#e44500}
.ov-card{margin-top:44px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);backdrop-filter:blur(6px);border-radius:20px;padding:24px}
.ov-card .eyebrow{margin-bottom:10px}
.ov-card p{font-size:clamp(16px,2vw,21px);color:#e9dfdb;max-width:70ch}
.ov-card p b{color:#ffb089}
.ov-grid{display:grid;gap:12px;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.ov-grid div{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px;background:rgba(0,0,0,.18)}
.ov-grid b{display:block;font:700 28px var(--f-display);color:#ff9a6b;font-variant-numeric:tabular-nums}
.ov-grid span{font-size:12px;color:#bfaea9}
.strip{display:flex;flex-wrap:wrap;gap:10px 28px;padding:16px 0;color:#d7c8c3;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.12);margin-top:28px}
/* acts on home */
.actrow{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:40px;padding:56px 0;border-top:1px solid var(--line)}
@media(max-width:820px){.actrow{grid-template-columns:1fr;gap:18px;padding:36px 0}}
.actrow .l{align-self:start;position:sticky;top:96px}
@media(max-width:820px){.actrow .l{position:static}}
.actrow .l small{display:block;font:500 12px var(--f-mono);letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.actrow .l h3{font:700 clamp(26px,3vw,36px) var(--f-display);color:var(--red-ink);letter-spacing:-.02em;padding-bottom:14px;border-bottom:2px solid var(--red)}
.actrow .l p{margin-top:14px;color:var(--muted);font-size:14px}
.rows{border-left:1px solid var(--line);padding-left:32px}
@media(max-width:820px){.rows{border-left:0;padding-left:0}}
.rowl{display:grid;grid-template-columns:44px 1fr 24px;gap:14px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:22px 0}
.rowl:last-child{border-bottom:0}
.rowl .n{font:300 38px var(--f-display);color:var(--muted);line-height:1}
.rowl b{display:block;font:600 19px var(--f-display);margin-bottom:5px}
.rowl span.s{display:block;color:var(--muted);font-size:14px}
.rowl .a{color:var(--muted);transition:transform .2s,color .2s;padding-top:6px}
.rowl:hover .a{transform:translateX(4px);color:var(--orange)}
.rowl:hover b{color:var(--red-ink)}
/* tower */
.tower-page{padding-top:92px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 30px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font:500 12px var(--f-mono);letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.pill i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.pill[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill[aria-selected="true"] i{background:var(--orange);border-color:var(--orange)}
.tw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
@media(max-width:900px){.tw{grid-template-columns:1fr}}
.tw h2{font-size:clamp(34px,5vw,56px);letter-spacing:-.03em;font-weight:600;margin:6px 0 14px}
.scene{perspective:1400px;height:420px;display:grid;place-items:center;position:relative}
@media(max-width:900px){.scene{height:340px;order:-1}}
.iso{position:relative;width:240px;height:240px;transform:rotateX(58deg) rotateZ(-38deg);transform-style:preserve-3d}
.sl{position:absolute;left:0;top:0;width:240px;height:240px;border-radius:18px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:flex-end;padding:14px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s,background .5s,box-shadow .5s;cursor:pointer;box-shadow:0 14px 0 -4px color-mix(in srgb,var(--ink) 18%,transparent)}
.sl span{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transform:rotateZ(0)}
.sl.on{background:linear-gradient(135deg,#9d0102,#e44500 70%,#f1a35a);border-color:transparent;box-shadow:0 18px 0 -4px rgba(120,20,0,.45),0 40px 60px rgba(228,69,0,.3)}
.sl.on span{color:#fff}
.sl.dim{opacity:.38}
.screen{position:absolute;right:0;bottom:30px;width:min(260px,52%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);font-size:11px;z-index:2}
@media(max-width:900px){.screen{position:static;width:100%;margin-top:12px}}
.screen b{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--red-ink);margin-bottom:8px}
.screen div.r{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);color:var(--muted)}
.screen div.r:last-child{border:0}
.mini{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:22px}
.mini .tile{align-items:center}
.sub{margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero2{--x:0}}
.scene{padding-top:90px}.iso{top:30px;margin-left:-150px}.screen{bottom:0}
@media(max-width:900px){.iso{margin-left:0}}
.btn{white-space:nowrap}
@media(max-width:640px){.brand span,#towerBtn{display:none}.top .wrap{padding:8px 10px}.hero2{padding-top:104px}.scene{padding-top:40px}}
</style>

<div class="top">
  <div class="wrap">
    <button class="brand" id="homeBtn" aria-label="Home"><div class="mark">K</div><div><b>KaarTech</b><span>Expertise portal</span></div></button>
    <div class="sp"></div>
    <button class="btn" id="tocBtn">☰ Contents</button>

let state={tab:0,chain:0,layer:0,motiva:'The customer',case:0};
function pageIndex(id){return PAGES.findIndex(p=>p.id===id)}
function home(){

function wire(id){

     {k:'Overview',slab:-1,t:'The full portfolio.',d:'Three layers of reusable capability under a hydrocarbon value chain. Pick a level to climb the stack.',ch:['Base','Enterprise','Industry','Value chain'],scr:['Layers|3','Value chain stages|6','Industry groups|4','Accelerated by|34+ flows']},
     {k:'Base',slab:0,t:'Base platform.',d:'Core processes, security, technical foundation and automation that every other layer reuses.',li:2,scr:LAYERS[2][2].map(g=>g[0]+'|'+g[1].length)},
     {k:'Enterprise',slab:1,t:'Enterprise layer.',d:'Finance, procurement, asset management, and data and analytics on the SAP enterprise stack.',li:1,scr:LAYERS[1][2].map(g=>g[0]+'|'+g[1].length)},
     {k:'Industry',slab:2,t:'Oil & gas industry.',d:'Industry core, distribution and retail, commodity trading and risk, and health and safety.',li:0,scr:LAYERS[0][2].map(g=>g[0]+'|'+g[1].length)},
     {k:'Value chain',slab:3,t:'Hydrocarbon value chain.',d:'Six stages from procurement to settlement, each with the processes KaarTech has delivered.',chain:1,scr:CHAIN.map(c=>c[0]+'|'+c[1].length)},
     {k:'Accelerators',slab:-2,t:'Accelerated delivery.',d:'34+ process flows, fit-to-standard checklists, templates, pre-configured system, test scripts and cutover plans.',acc:1,scr:['Process flows|34+','Templates|8','System|pre-configured','Cutover|ready']}];
    const SL=['Base','Enterprise','Industry','Value chain'];

       <div class="cta"><button class="btn go" id="climb">${(state.tab||0)<TABS.length-1?'Climb to '+E(TABS[(state.tab||0)+1].k)+' ↑':'Back to overview'}</button><button class="btn" data-go="${T.acc?'accelerators':'why'}">${T.acc?'Open accelerators →':'Why KaarTech →'}</button></div>`;
      sc.innerHTML=`<div class="iso">${SL.map((n,i)=>{const on=T.slab===i,all=T.slab<0;return `<div class="sl ${on?'on':''} ${(!on&&T.slab>=0)?'dim':''}" data-s="${i}" style="transform:translateZ(${i*68}px) ${on?'translate(-14px,14px)':''};${all&&T.slab===-2?'background:linear-gradient(135deg,#9d0102,#e44500 70%,#f1a35a);border-color:transparent':''}"><span>${n}</span></div>`}).join('')}</div>
       <div class="screen"><b>${E(T.k)}</b>${T.scr.map(r=>{const p=r.split('|');return `<div class="r"><span>${E(p[0])}</span><span>${E(p[1])}</span></div>`}).join('')}</div>`;

      else body=`<div class="grid g2">${LAYERS.map(l=>`<div class="grp"><h4>${E(l[1])}</h4>${chips(l[2].map(g=>g[0]))}</div>`).join('')}<div class="grp"><h4>Value chain</h4>${chips(CHAIN.map(c=>c[0]))}</div></div>`;
      D.innerHTML=body;

      pills.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{state.tab=+b.dataset.i;draw()});
      sc.querySelectorAll('.sl').forEach(b=>b.onclick=()=>{state.tab=+b.dataset.s+1;draw()});
      document.getElementById('climb').onclick=()=>{state.tab=((state.tab||0)+1)%TABS.length;draw()};
      bind();
    };
    draw();
  }
  if(id==='motiva'){
    const pn=document.getElementById('mpanel'),tb=document.getElementById('mtabs');
    const draw=()=>{pn.innerHTML=`<div class="fade">${MOTIVA[state.motiva]()}</div>`;tb.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===state.motiva))};

      tb.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',+t.dataset.i===state.case))};

function closeToc(){ov.hidden=true}
document.getElementById('tocBtn').onclick=openToc;
document.getElementById('closeToc').onclick=closeToc;

  if(e.key==='Escape')closeToc();
  if(!ov.hidden||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const i=pageIndex((location.hash||'#').slice(1));
  if(e.key==='ArrowRight'){const n=PAGES[i+1];if(i<0)go(PAGES[0].id);else if(n)go(n.id)}

/* theme */
const root=document.documentElement;
function setTheme(t){ if(t) root.setAttribute('data-theme',t); }
document.getElementById('themeBtn').onclick=()=>{
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  setTheme(cur==='dark'?'light':'dark');
};
